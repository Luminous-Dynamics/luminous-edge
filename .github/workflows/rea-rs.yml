name: REA-RS Rust prototype

on:
  pull_request:
    paths:
      - "rust/rea-rs/**"
      - ".github/workflows/rea-rs.yml"
      - "docs/rea-rust-successor.md"
      - "scripts/rea-self-audit.sh"
  push:
    branches: [main]
    paths:
      - "rust/rea-rs/**"
      - ".github/workflows/rea-rs.yml"
      - "docs/rea-rust-successor.md"
      - "scripts/rea-self-audit.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-rs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, test, lint, offline re-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install stable Rust, rustfmt, and Clippy
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Resolve exact dependency graph for this run
        run: cargo generate-lockfile --manifest-path rust/rea-rs/Cargo.toml

      - name: Run tests
        run: cargo test --manifest-path rust/rea-rs/Cargo.toml --locked

      - name: Re-test with network access disabled
        run: cargo test --manifest-path rust/rea-rs/Cargo.toml --locked --offline

      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path rust/rea-rs/Cargo.toml --locked --all-targets -- -D warnings

      - name: Check formatting
        if: always()
        run: cargo fmt --manifest-path rust/rea-rs/Cargo.toml -- --check

      - name: Preserve resolved lockfile for review
        if: always() && hashFiles('rust/rea-rs/Cargo.lock') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rea-rs-cargo-lock-${{ github.sha }}
          path: rust/rea-rs/Cargo.lock
          if-no-files-found: error
          retention-days: 7

  self-audit:
    name: Pinned REA release self-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 26.10.0

      - name: Check audit harness shell syntax
        run: bash -n scripts/rea-self-audit.sh

      - name: Audit the published package with REA
        env:
          REA_SELF_AUDIT_DIR: ${{ runner.temp }}/rea-self-audit-${{ github.run_id }}
        run: bash scripts/rea-self-audit.sh

      - name: Preserve self-audit evidence, including blocked results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rea-self-audit-${{ github.sha }}
          path: ${{ runner.temp }}/rea-self-audit-${{ github.run_id }}/**
          if-no-files-found: warn
          retention-days: 7
