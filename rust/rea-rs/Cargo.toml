[package]
name = "rea-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline, read-only artifact inventory prototype for a Rust-native REA successor"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "rea-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }
